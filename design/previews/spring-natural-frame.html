<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Spring Natural Frame V2 — Vườn Xuân Rực Rỡ (preview)</title>
<style>
  :root {
    --font: "Be Vietnam Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 72px 32px;
    background: #FAFAF8;
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
  }
  .preview-stage { display: flex; flex-direction: column; align-items: center; gap: 30px; }
  .preview-label { font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: #9ca3af; font-weight: 700; }

  /* ---- Portrait card ---- */
  .portrait-container { position: relative; width: 340px; height: 465px; }
  .portrait-glow-aura {
    position: absolute; inset: -5%; border-radius: 32px;
    background: conic-gradient(from 180deg, rgba(249,168,212,0.28) 0%, rgba(167,139,250,0.16) 35%, rgba(251,191,36,0.14) 70%, rgba(249,168,212,0.28) 100%);
    filter: blur(28px); opacity: 0.55; pointer-events: none; z-index: 0;
  }
  .portrait-gradient-border {
    position: absolute; inset: -2px; border-radius: 26px;
    background: linear-gradient(135deg, rgba(249,168,212,0.75) 0%, rgba(167,139,250,0.55) 50%, rgba(251,146,60,0.6) 100%);
    z-index: 1; pointer-events: none; opacity: 0.65;
  }
  .portrait-frame {
    position: relative; z-index: 2; width: 100%; height: 100%;
    border-radius: 24px; overflow: hidden; background: #090c12;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
  }
  .portrait-frame img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: center 18%; border-radius: 24px; }
  .portrait-overlay {
    position: absolute; inset: 0; z-index: 2;
    background: linear-gradient(to top, rgba(7,8,12,0.94) 0%, rgba(7,8,12,0.45) 30%, transparent 65%);
    pointer-events: none;
  }

  /* HUD */
  .portrait-top-hud { position: absolute; top: 14px; left: 14px; right: 14px; z-index: 3; display: flex; justify-content: space-between; align-items: center; }
  .status-live-pill {
    display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px; border-radius: 999px;
    background: rgba(9,12,18,0.75); border: 1px solid rgba(255,255,255,0.15);
    font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: #fff;
  }
  .pulse-dot-green { width: 7px; height: 7px; border-radius: 50%; background: #10b981; box-shadow: 0 0 10px #10b981; }
  .award-mini-pill {
    display: inline-flex; align-items: center; gap: 5px; padding: 4px 11px; border-radius: 999px;
    background: rgba(9,12,18,0.75); border: 1px solid rgba(236,72,153,0.45);
    font-size: 11px; font-weight: 700; letter-spacing: 0.04em; color: #f9a8d4;
  }
  .award-mini-pill svg { color: #f9a8d4; }

  .portrait-bottom-info {
    position: absolute; bottom: 14px; left: 14px; right: 14px; z-index: 3;
    display: flex; justify-content: space-between; align-items: flex-end; gap: 12px;
    padding: 12px 16px; border-radius: 18px;
    background: rgba(9,12,18,0.85); border: 1px solid rgba(255,255,255,0.14);
    box-shadow: 0 12px 32px rgba(0,0,0,0.45);
  }
  .info-identity { display: flex; flex-direction: column; }
  .info-name { font-size: 15.5px; font-weight: 800; color: #fff; line-height: 1.2; }
  .info-role { font-size: 11.5px; color: #f9a8d4; font-weight: 700; margin-top: 2px; }
  .info-motto { display: flex; flex-direction: column; text-align: right; font-size: 11px; color: #94a3b8; }
  .info-motto strong { color: #fff; font-size: 12px; }

  /* ---- Khung avatar theo mùa (copy từ globals.css) ---- */
  .avatar-seasonal-frame-wrapper { position: absolute; inset: -6px; z-index: 10; pointer-events: none; }
  .wrapped-frame { position: absolute; inset: 0; pointer-events: none; }

  .frame-border-top { position: absolute; top: -8px; left: -4px; right: -4px; height: 36px; z-index: 12; }
  .frame-border-side { position: absolute; top: 10px; bottom: 12px; width: 30px; z-index: 11; }
  .frame-border-side.border-left { left: -14px; }
  .frame-border-side.border-right { right: -14px; }
  .frame-border-bottom { position: absolute; bottom: -6px; left: -4px; right: -4px; height: 42px; z-index: 12; }

  .corner-ornament { position: absolute; pointer-events: none; }

  /* ---- Vườn Xuân Rực Rỡ ---- */
  .garden-top-svg, .garden-side-svg, .garden-bottom-svg { width: 100%; height: 100%; }

  .corner-ornament.garden-tl { top: -28px; left: -26px; z-index: 15; transform: rotate(-8deg); animation: garden-sway 7s ease-in-out infinite alternate; }
  .corner-ornament.garden-tr { top: -18px; right: -32px; z-index: 15; animation: butterfly-drift 6s ease-in-out infinite alternate; }
  .corner-ornament.garden-bl { bottom: -14px; left: -24px; z-index: 14; transform: rotate(10deg); }
  .corner-ornament.garden-br { bottom: -14px; right: -28px; z-index: 14; }

  .garden-sparkle { animation: garden-twinkle 2.6s ease-in-out infinite alternate; }
  .garden-bee { animation: garden-bee-hover 4.5s ease-in-out infinite alternate; }
  .garden-petal-fall { position: absolute; top: 0; width: 12px; height: 10px; opacity: 0; animation: garden-petal-fall 10s linear infinite; }

  @keyframes garden-sway { 0% { transform: rotate(-10deg) translateY(0); } 100% { transform: rotate(-6deg) translateY(-2px); } }
  @keyframes garden-twinkle { 0% { opacity: 0.35; } 100% { opacity: 1; } }
  @keyframes butterfly-drift { 0% { transform: translateY(0) rotate(0deg); } 100% { transform: translateY(-5px) rotate(5deg); } }
  @keyframes garden-bee-hover { 0% { transform: translate(0, 0) rotate(-5deg); } 100% { transform: translate(2px, -3px) rotate(6deg); } }
  @keyframes garden-petal-fall {
    0% { transform: translate3d(0, -18px, 0) rotate(0deg); opacity: 0; }
    10% { opacity: 0.95; }
    72% { opacity: 0.9; }
    88% { opacity: 0; }
    100% { transform: translate3d(18px, 430px, 0) rotate(300deg); opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .corner-ornament.garden-tl, .corner-ornament.garden-tr, .garden-sparkle, .garden-bee, .garden-petal-fall { animation: none; }
  }
</style>
</head>
